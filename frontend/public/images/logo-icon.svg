<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <radialGradient id="gold-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="40%" stop-color="#F5B014" />
      <stop offset="70%" stop-color="#C68A04" />
      <stop offset="100%" stop-color="#805000" />
    </radialGradient>
    <radialGradient id="center-rainbow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="35%" stop-color="#FFEB3B" />
      <stop offset="70%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2196F3" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FFD700" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="25" cy="25" r="23" fill="url(#gold-radial)" filter="url(#glow)" />
  <circle cx="25" cy="25" r="20" fill="#1A1813" stroke="#FFDF00" stroke-width="1" />
  
  <!-- Sacred Geometric Star / Chakra -->
  <g stroke="#F5B014" stroke-width="1" fill="none">
    <polygon points="25,7 39,32 11,32" stroke="#FFDF00" stroke-width="1.2" />
    <polygon points="25,37 39,12 11,12" stroke="#FFDF00" stroke-width="1.2" />
    <circle cx="25" cy="22" r="10" stroke="#FFD54F" stroke-width="0.8" />
  </g>

  <!-- Colorful Center -->
  <circle cx="25" cy="22" r="6" fill="url(#center-rainbow)" stroke="#FFF" stroke-width="1" />
  <circle cx="25" cy="22" r="2" fill="#FFFFFF" />
</svg>
