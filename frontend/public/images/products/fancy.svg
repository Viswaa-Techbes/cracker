<!-- Fancy Category Illustration (Helicopter / Novelty) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <linearGradient id="wing-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
  </defs>
  <!-- Rotor blades -->
  <ellipse cx="100" cy="55" rx="75" ry="8" fill="url(#wing-grad)" opacity="0.9"/>
  <rect x="96" y="55" width="8" height="25" fill="#37474F" rx="2"/>
  <!-- Body -->
  <path d="M55,95 Q55,75 100,75 Q145,75 145,95 Q145,120 100,120 Q55,120 55,95 Z" fill="url(#body-grad)" />
  <!-- Windshield -->
  <ellipse cx="120" cy="92" rx="16" ry="12" fill="#E0F7FA" stroke="#0097A7" stroke-width="2"/>
  <!-- Tail boom and rotor -->
  <rect x="25" y="90" width="35" height="8" rx="3" fill="#D32F2F" />
  <ellipse cx="25" cy="88" rx="4" ry="16" fill="#FFC107" />
  <!-- Landing skids -->
  <line x1="75" y1="120" x2="70" y2="138" stroke="#455A64" stroke-width="4"/>
  <line x1="120" y1="120" x2="125" y2="138" stroke="#455A64" stroke-width="4"/>
  <rect x="55" y="138" width="85" height="5" rx="2.5" fill="#263238"/>
  <!-- Sparks & stars -->
  <polygon points="160,50 163,60 174,62 165,68 168,78 159,71 151,77 155,67 146,61 157,59" fill="#FFD54F"/>
  <polygon points="35,45 37,52 45,54 38,58 40,66 34,61 28,65 31,57 24,53 32,52" fill="#FFEB3B"/>
</svg>
